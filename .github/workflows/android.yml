name: Android

on:
  push:
    paths:
      - "android/**"
      - "api/**"
      - "services/**"
      - "contracts/**"
      - "deploy/**"
      - "Caddyfile*"
      - "docker-compose*.yml"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "api/**"
      - "services/**"
      - "contracts/**"
      - "deploy/**"
      - "Caddyfile*"
      - "docker-compose*.yml"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Build instrumentation APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebugAndroidTest

      - name: Enable KVM for device tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          working-directory: ./android
          script: ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest

      - name: Build release bundle
        run: ./gradlew --no-daemon --stacktrace :app:bundleRelease

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: planora-android-${{ github.sha }}
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
