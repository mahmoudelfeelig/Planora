services:
  planora-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PLANORA_DB_PATH: /app/data/planora.sqlite3
      PLANORA_TRUST_DEV_HEADERS: "1"
      PLANORA_TRUST_PROXY_HEADERS: "0"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - planora-data:/app/data

  planora-web:
    image: node:22-slim
    working_dir: /app/web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_PLANORA_API_URL: http://localhost:8787
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ..:/app
    depends_on:
      - planora-api

volumes:
  planora-data:
